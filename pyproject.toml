[project]
name = "lodestone"
version = "0.3.0"
description = "Lodestone: personal arxiv research knowledge base (single-file SQLite)."
requires-python = ">=3.11"
dependencies = [
    "arxiv",
    "httpx",
    "beautifulsoup4",
    "lxml",
    "Pillow",
    "pydantic>=2",
    "sentence-transformers",
    "gliner2",
    "sqlite-vec==0.1.9",
    "rapidfuzz",
    "pyyaml",
    "tenacity",
    "anthropic",
    "openai",
    "google-genai",
    "tomli-w",
    "pylatexenc",
    "trafilatura",
    "htmldate",
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
lodestone-mcp = "_system.scripts.mcp_server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["_system"]

[tool.uv]
# Block PyPI versions published less than 7 days ago so the security community
# has a window to catch supply-chain compromises before we install them.
# Locked deps are unaffected; this only gates new version resolutions.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["_system/tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests that load heavy external models (deselect with '-m \"not slow\"')",
]
